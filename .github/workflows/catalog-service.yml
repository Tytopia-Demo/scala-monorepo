name: Catalog Service CI

on:
  push:
    branches:
      - main
      - master
      - 2.5
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  pull_request:
    branches:
      - main
      - master
      - 2.5
    paths:
      - 'catalog-service/**'
      - '.github/workflows/catalog-service.yml'
  workflow_dispatch:

env:
  SERVICE_NAME: catalog-service

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-catalog-${{ hashFiles('catalog-service/**/build.sbt', 'catalog-service/**/project/build.properties', 'catalog-service/**/project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-catalog-
            ${{ runner.os }}-sbt-

      - name: Clean cache files
        run: |
          find $HOME/.ivy2 -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt -name "*.lock" -delete || true

      - name: Compile
        working-directory: catalog-service
        run: sbt compile

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: catalog-service-build
          path: catalog-service/target/
          retention-days: 1

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: 'sbt'

      - name: Cache SBT
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-catalog-${{ hashFiles('catalog-service/**/build.sbt', 'catalog-service/**/project/build.properties', 'catalog-service/**/project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-catalog-
            ${{ runner.os }}-sbt-

      - name: Run tests
        working-directory: catalog-service
        run: sbt multi-jvm:test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: catalog-service-test-results
          path: |
            catalog-service/target/test-reports/
            catalog-service/target/surefire-reports/
          if-no-files-found: ignore

  # Security scanning with Snyk (migrated from CircleCI orb)
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/scala@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=catalog-service/build.sbt

      - name: Upload Snyk results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: snyk.sarif
