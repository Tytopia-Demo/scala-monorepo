name: "Frogbot Security Scan"

on:
  pull_request_target: 
    types: [opened, synchronize]
  push:
    branches:
      - 2.5
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write
  security-events: write

jobs:
  frogbot-scan:
    runs-on: ubuntu-latest  # Small runner - security scans are lightweight
    timeout-minutes: 10  # Appropriate timeout for security scanning

    # Cost monitoring and tracking labels
    env:
      COST_CENTER: "security"
      RUNNER_SIZE: "small"
      PROJECT: ${{ github.event.repository.name }}

    strategy:
      matrix:
        branch: ["2.5"]

    steps:
      - name: Job Start Time
        id: start
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - uses: jfrog/frogbot@v2
        env:
          JF_URL: ${{ secrets.JF_URL }}
          JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
          JF_GIT_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JF_GIT_BASE_BRANCH: ${{ matrix.branch }}

      - name: Job Duration and Metrics
        id: duration
        if: always()
        run: |
          end_time=$(date +%s)
          duration=$((end_time - ${{ steps.start.outputs.start_time }}))
          echo "Job duration: ${duration}s"
          echo "job_duration=${duration}" >> $GITHUB_OUTPUT
          echo "### Frogbot Security Scan Metrics :shield:" >> $GITHUB_STEP_SUMMARY
          echo "- Duration: ${duration}s" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: ${{ matrix.branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- Runner Size: small" >> $GITHUB_STEP_SUMMARY
          echo "- Cost Center: security" >> $GITHUB_STEP_SUMMARY
