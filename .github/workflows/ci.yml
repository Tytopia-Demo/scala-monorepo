name: CI

on:
  push:
    branches:
      - main
      - master
      - 2.5
  pull_request:
    branches:
      - main
      - master
      - 2.5
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  test:
    name: Test - ${{ matrix.project }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        include:
          # SBT-based projects
          - project: akka-sample-camel-java
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-camel-scala
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-cluster-java
            build-tool: sbt
            test-command: sbt multi-jvm:test
          - project: akka-sample-cluster-scala
            build-tool: sbt
            test-command: sbt multi-jvm:test
          - project: akka-sample-distributed-data-java
            build-tool: sbt
            test-command: sbt multi-jvm:test
          - project: akka-sample-fsm-java
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-main-java
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-main-scala
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-persistence-java
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-persistence-scala
            build-tool: sbt
            test-command: sbt test
          - project: akka-sample-supervision-java
            build-tool: sbt
            test-command: sbt test
          # Maven-based projects
          - project: akka-sample-fsm-java
            build-tool: maven
            test-command: mvn test
          - project: akka-sample-main-java
            build-tool: maven
            test-command: mvn test
          - project: akka-sample-osgi-dining-hakkers
            build-tool: maven
            test-command: mvn compile
          - project: akka-sample-persistence-java
            build-tool: maven
            test-command: mvn test
          - project: akka-sample-supervision-java
            build-tool: maven
            test-command: mvn test
          - project: akka-sample-vavr
            build-tool: maven
            test-command: mvn test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: ${{ matrix.build-tool }}

      - name: Cache SBT
        if: matrix.build-tool == 'sbt'
        uses: actions/cache@v3
        with:
          path: |
            ~/.ivy2/cache
            ~/.sbt
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/build.sbt', '**/project/build.properties', '**/project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Cache Maven
        if: matrix.build-tool == 'maven'
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Set up Maven 3.5.4
        if: matrix.build-tool == 'maven'
        run: |
          wget -q https://archive.apache.org/dist/maven/maven-3/3.5.4/binaries/apache-maven-3.5.4-bin.zip
          unzip -qq apache-maven-3.5.4-bin.zip
          echo "$PWD/apache-maven-3.5.4/bin" >> $GITHUB_PATH

      - name: Clean cache files (SBT)
        if: matrix.build-tool == 'sbt'
        run: |
          find $HOME/.ivy2 -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt -name "*.lock" -delete || true

      - name: Run tests
        working-directory: ${{ matrix.project }}
        run: ${{ matrix.test-command }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-${{ matrix.project }}-${{ matrix.build-tool }}
          path: |
            ${{ matrix.project }}/target/test-reports/
            ${{ matrix.project }}/target/surefire-reports/
          if-no-files-found: ignore

  build-status:
    name: Build Status
    runs-on: ubuntu-latest
    needs: test
    if: always()
    steps:
      - name: Check build status
        run: |
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ All tests passed"
            exit 0
          else
            echo "❌ Some tests failed"
            exit 1
          fi
